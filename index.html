<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d5dfc"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Syllabus Tracker"><link rel="manifest" href="manifest.webmanifest"><title>Syllabus Tracker</title><style>
:root{--bg:#f7f7fb;--card:#fff;--text:#171722;--muted:#6e6e7d;--accent:#6d5dfc;--line:#e7e7ef;--danger:#d84a5b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;color:var(--text);padding-bottom:32px}.wrap{max-width:760px;margin:auto;padding:20px 16px}.hero{padding:18px 4px 14px}.hero h1{font-size:30px;margin:0 0 5px}.hero p{margin:0;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 18px rgba(30,25,70,.05)}label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;background:#fff}button{border:0;border-radius:12px;padding:12px 15px;font-size:15px;font-weight:650;cursor:pointer}.primary{background:var(--accent);color:white;width:100%;margin-top:10px}.secondary{background:#f0efff;color:#4e43c8}.danger{background:#fff0f2;color:var(--danger)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#faf9ff;border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font-size:24px;margin-top:3px}.muted{color:var(--muted);font-size:13px}.progress{height:10px;background:#ececf3;border-radius:99px;overflow:hidden;margin:10px 0}.bar{height:100%;background:var(--accent);border-radius:99px;transition:width .25s}.book-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.book-title{font-size:18px;font-weight:750;margin:0}.pct{font-weight:800;color:var(--accent);white-space:nowrap}.range{color:var(--muted);font-size:13px;margin-top:3px}.book-actions{display:flex;gap:8px;margin-top:10px}.readrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:12px}.readrow button{min-width:90px}.empty{text-align:center;color:var(--muted);padding:24px 8px}.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.small{font-size:12px}.install{display:none;background:#eeeaff;color:#4e43c8}.notice{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}@media(min-width:600px){.wrap{padding:32px 22px}}
</style></head><body><main class="wrap"><section class="hero"><h1>📚 Syllabus Tracker</h1><p>Track every book and your whole syllabus at a glance.</p><div class="top-actions"><button id="installBtn" class="install">Add to Home Screen</button><button id="clearBtn" class="danger">Clear all</button></div></section>
<section class="card"><div class="stats"><div class="stat"><span class="muted">Whole syllabus</span><b id="overall">0%</b></div><div class="stat"><span class="muted">Pages covered</span><b id="pages">0 / 0</b></div></div><div class="progress"><div id="overallBar" class="bar" style="width:0%"></div></div></section>
<section class="card"><h2 style="margin:0 0 14px;font-size:20px">Add a book</h2><form id="addForm"><div class="grid"><div class="full"><label for="name">Book name</label><input id="name" required placeholder="e.g. Robbins Pathology"></div><div><label for="start">First page</label><input id="start" required type="number" min="1" inputmode="numeric" placeholder="1"></div><div><label for="end">Last page</label><input id="end" required type="number" min="1" inputmode="numeric" placeholder="500"></div></div><button class="primary" type="submit">＋ Add book</button></form><div class="notice">Page range is inclusive. Example: 1–500 = 500 syllabus pages.</div></section>
<section id="books"></section></main>
<script>
const KEY='syllabus-tracker-v3';let books=[];let deferredPrompt=null;
function load(){try{books=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(books))books=[]}catch(e){books=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(books))}catch(e){alert('Your browser is blocking storage. Open this app in Safari/Chrome rather than a file preview.')}}
function pct(b){return b.total?Math.min(100,Math.max(0,b.read/b.total*100)):0}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const total=books.reduce((a,b)=>a+b.total,0),read=books.reduce((a,b)=>a+b.read,0),op=total?read/total*100:0;document.querySelector('#overall').textContent=op.toFixed(1)+'%';document.querySelector('#pages').textContent=read+' / '+total;document.querySelector('#overallBar').style.width=op+'%';const root=document.querySelector('#books');if(!books.length){root.innerHTML='<div class="card empty">No books yet. Add your first book above.</div>';return}root.innerHTML=books.map((b,i)=>{const p=pct(b);return `<article class="card"><div class="book-head"><div><p class="book-title">${esc(b.name)}</p><div class="range">Pages ${b.start}–${b.end} · ${b.total} pages</div></div><div class="pct">${p.toFixed(1)}%</div></div><div class="progress"><div class="bar" style="width:${p}%"></div></div><div class="readrow"><div><label for="read-${i}">Pages read</label><input id="read-${i}" type="number" min="0" max="${b.total}" value="${b.read}" inputmode="numeric"></div><button class="secondary" onclick="updateBook(${i})">Update</button></div><div class="book-actions"><button class="danger" onclick="removeBook(${i})">Remove</button></div></article>`}).join('')}
function addBook(e){e.preventDefault();const name=document.querySelector('#name').value.trim(),start=Number(document.querySelector('#start').value),end=Number(document.querySelector('#end').value);if(!name||!Number.isInteger(start)||!Number.isInteger(end)||start<1||end<start){alert('Please enter a book name and a valid page range.');return}books.push({id:Date.now()+Math.random(),name,start,end,total:end-start+1,read:0});save();e.target.reset();render();document.querySelector('#name').focus()}
function updateBook(i){const el=document.querySelector('#read-'+i),n=Number(el.value);if(!Number.isFinite(n)||n<0||n>books[i].total){alert('Pages read must be between 0 and '+books[i].total+'.');return}books[i].read=Math.floor(n);save();render()}
function removeBook(i){if(confirm('Remove '+books[i].name+'?')){books.splice(i,1);save();render()}}
document.querySelector('#addForm').addEventListener('submit',addBook);document.querySelector('#clearBtn').addEventListener('click',()=>{if(confirm('Delete all books and progress?')){books=[];save();render()}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.querySelector('#installBtn').style.display='inline-block'});document.querySelector('#installBtn').addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}else alert('On iPad: open this site in Safari, tap Share, then Add to Home Screen.')});
if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));load();render();
</script></body></html>
